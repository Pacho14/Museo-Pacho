<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Visualizador Memphis 3D — Museo de Pacho</title>

    <!-- Model Viewer de Google (Industry Standard for WebAR) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', -apple-system, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #222 0%, #050505 100%);
            --progress-bar-color: #818CF8;
        }

        /* Botón de Salir */
        .exit-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Botón AR Principal */
        .ar-button {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 16px 32px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .ar-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* Overlay de Información */
        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 250px;
            pointer-events: none;
            z-index: 90;
        }

        .info-panel h2 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #818CF8;
            text-transform: uppercase;
        }

        .info-panel p {
            font-size: 0.8rem;
            opacity: 0.8;
            line-height: 1.4;
        }

        /* Indicador de gestos */
        .hand-hint {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            backdrop-filter: blur(5px);
            opacity: 0.6;
            z-index: 80;
        }

        /* Animación de carga */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #818CF8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <button class="exit-btn" onclick="window.location.href='index.html'">✕</button>

    <div class="info-panel">
        <h2>Sala Naturaleza</h2>
        <p>Modelo Memphis 3D. Usa el botón AR para ubicarlo en tu mundo real.</p>
    </div>

    <div class="hand-hint">↔️ Desliza para rotar · 🤏 Pellizca para zoom</div>

    <model-viewer id="mv-viewer" src="MEMPHIS3.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls
        auto-rotate shadow-intensity="1" exposure="1" environment-image="neutral" ar-scale="auto" touch-action="pan-y">
        <button slot="ar-button" class="ar-button">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 8l8-4 8 4M4 16l8 4 8-4M12 12l0 8M4 8v8M20 8v8M12 4v8"></path>
            </svg>
            UBICAR EN MI ESPACIO
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mv-viewer');
        const loader = document.getElementById('loader');

        // Manejar el parámetro del modelo
        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model');
        if (modelFile) {
            modelViewer.src = modelFile;
            console.log('[Viewer] Cargando:', modelFile);
        }

        modelViewer.addEventListener('load', () => {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
            console.log('[Viewer] Modelo cargado');
        });

        modelViewer.addEventListener('error', (e) => {
            console.error('[Viewer] Error:', e);
            alert('Error cargando el modelo 3D.');
        });

        // Prevenir scroll accidental
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
