<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AR Visualizador — Museo de Pacho</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #000;
        }

        #ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: auto;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
        }

        .btn-round {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .photo-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 5px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .photo-btn:active {
            transform: scale(0.9);
        }

        .photo-btn svg {
            color: #333;
        }

        .tip-box {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        #shutter-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes flash-anim {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .is-flashing {
            animation: flash-anim 0.2s ease-out;
        }
    </style>
</head>

<body>

    <div id="shutter-flash"></div>

    <div id="ui-container">
        <div class="header">
            <button class="btn-round" onclick="window.location.href='index.html'">✕</button>
            <div class="tip-box" id="status-msg">Escaneando superficie...</div>
            <div style="width: 50px;"></div> <!-- Spacer -->
        </div>

        <div class="footer">
            <div class="tip-box" id="gesture-tip">Desliza para rotar · Pellizca para zoom</div>
            <button class="photo-btn" onclick="takePhoto()" title="Tomar Foto">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
        </div>
    </div>

    <a-scene webxr="optionalFeatures: hit-test; requiredFeatures: local-floor;"
        renderer="colorManagement: true; antialias: true;" ar-hit-test="target: #viewer-anchor; type: footprint;"
        device-orientation-permission-ui="enabled: true">
        <a-sky id="desktop-bg" color="#111" radius="30"></a-sky>

        <a-camera position="0 1.6 3" look-controls="enabled: false"></a-camera>

        <a-entity id="viewer-anchor" position="0 0 0">
            <a-entity id="model-container" gesture-handler>
                <a-entity id="main-model"></a-entity>
            </a-entity>
            <a-ring id="ar-ring" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.15" color="#22C55E"
                opacity="0.8"></a-ring>
        </a-entity>

        <a-light type="ambient" intensity="0.8"></a-light>
        <a-light type="directional" position="1 4 2" intensity="1.5" color="#fff"></a-light>
        <a-light type="point" position="-2 3 1" intensity="0.8" color="#A8F5C8"></a-light>
    </a-scene>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model') || 'MEMPHIS3.glb';
        const modelEl = document.getElementById('main-model');
        const statusMsg = document.getElementById('status-msg');

        modelEl.setAttribute('gltf-model', `./${modelFile}`);
        modelEl.setAttribute('scale', '5 5 5'); // Escala base para viewer

        modelEl.addEventListener('model-loaded', () => {
            statusMsg.textContent = "Modelo listo. Ubícalo en AR.";

            // Lógica de centrado
            const obj = modelEl.getObject3D('mesh');
            if (obj) {
                const box = new THREE.Box3().setFromObject(obj);
                const center = new THREE.Vector3();
                box.getCenter(center);
                const worldPos = new THREE.Vector3();
                modelEl.object3D.getWorldPosition(worldPos);

                obj.position.x = -(center.x - worldPos.x);
                obj.position.y = -(box.min.y - worldPos.y);
                obj.position.z = -(center.z - worldPos.z);
            }
        });

        // Componente para rotación manual (Drag)
        AFRAME.registerComponent('gesture-handler', {
            init: function () {
                this.internalRotation = { x: 0, y: 0 };
                this.isDragging = false;
                this.previousMouse = { x: 0, y: 0 };

                const scene = this.el.sceneEl;

                const onMove = (e) => {
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    if (this.isDragging) {
                        const deltaX = clientX - this.previousMouse.x;
                        this.el.object3D.rotation.y += deltaX * 0.01;
                        this.previousMouse.x = clientX;
                    }
                };

                const onStart = (e) => {
                    this.isDragging = true;
                    this.previousMouse.x = e.touches ? e.touches[0].clientX : e.clientX;
                };

                const onEnd = () => { this.isDragging = false; };

                window.addEventListener('mousedown', onStart);
                window.addEventListener('touchstart', onStart);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove);
                window.addEventListener('mouseup', onEnd);
                window.addEventListener('touchend', onEnd);
            }
        });

        function takePhoto() {
            // Ocultar UI
            const ui = document.getElementById('ui-container');
            const flash = document.getElementById('shutter-flash');

            ui.style.opacity = '0';
            flash.classList.add('is-flashing');

            setTimeout(() => {
                flash.classList.remove('is-flashing');
                // Mantener oculto un momento para que el usuario tome su captura nativa
                setTimeout(() => {
                    ui.style.opacity = '1';
                }, 2000);
            }, 200);
        }

        window.addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            if (scene.is('ar-mode')) {
                document.getElementById('ar-ring').setAttribute('visible', false);
                statusMsg.textContent = "Objeto fijado.";
            }
        });

        document.querySelector('a-scene').addEventListener('enter-vr', () => {
            if (document.querySelector('a-scene').is('ar-mode')) {
                document.getElementById('desktop-bg').setAttribute('visible', false);
            }
        });
    </script>
</body>

</html>
