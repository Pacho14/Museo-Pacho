<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador Virtual de Anillo — Museo de Pacho</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030305;
            font-family: 'Inter', system-ui, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Video de fondo (espejado) */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* Canvas transparente (espejado para coincidir) */
        .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Botón de Salir - Premium Glass */
        .exit-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 48px;
            height: 48px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .exit-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366F1;
            transform: rotate(90deg) scale(1.1);
        }

        /* Pantalla de inicio - Ultra Premium */
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10, 10, 15, 0.8) 0%, #030305 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            text-align: center;
            padding: 24px;
            backdrop-filter: blur(8px);
        }

        #start-screen h1 {
            font-family: 'Outfit', sans-serif;
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #818CF8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        #start-screen p {
            font-size: 1rem;
            color: #94A3B8;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        #start-btn {
            background: #6366F1;
            border: none;
            border-radius: 50px;
            color: white;
            padding: 18px 42px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.6);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        #start-btn:hover {
            transform: translateY(-4px);
            background: #818CF8;
            box-shadow: 0 15px 50px -10px rgba(99, 102, 241, 0.8);
        }

        #loading {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #E2E8F0;
            z-index: 1500;
        }

        .hint-text {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
            pointer-events: none;
        }
    </style>
    </style>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <button class="exit-btn" onclick="window.location.href='index.html'">✕</button>

    <div id="start-screen">
        <h1>Probador de Anillo Inmersivo</h1>
        <p style="margin-bottom: 30px; opacity: 0.8;">Muestra tu mano a la cámara para probarte el anillo de diamante de
            la Sala Arte.</p>
        <button id="start-btn">Iniciar Experiencia</button>
    </div>

    <div id="loading" style="display: none;">Cargando sistema de IA...</div>
    <div class="hint-text">Muestra tu mano frente a la cámara</div>

    <script type="module" src="ring-tryon.js"></script>
</body>

</html>
