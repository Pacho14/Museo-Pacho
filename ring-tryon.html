<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probador Virtual de Anillo — Museo de Pacho</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030305;
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: var(--md-sys-color-on-surface);
        }

        :root {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-on-surface-variant: #CAC4D0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Video de fondo (espejado) */
        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* Canvas transparente (espejado para coincidir) */
        .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Botón de Salir - Premium Glass */
        .exit-btn {
            position: fixed;
            top: 32px;
            left: 32px;
            width: 48px;
            height: 48px;
            background: rgba(28, 27, 31, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: var(--md-sys-color-on-surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.6s cubic-bezier(0.05, 0.7, 0.1, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .exit-btn:hover {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            transform: scale(1.1) rotate(90deg);
        }

        /* Pantalla de inicio - Material Luxe Cover */
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(28, 27, 31, 0.6) 0%, #030305 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            text-align: center;
            padding: 40px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        #start-screen h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 800;
            color: var(--md-sys-color-on-surface);
            letter-spacing: -0.02em;
            line-height: 0.9;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        #start-screen p {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--md-sys-color-primary);
            max-width: 400px;
            margin-bottom: 48px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        #start-btn {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 20px 56px;
            border-radius: 100px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.05, 0.7, 0.1, 1);
            box-shadow: 0 12px 32px rgba(208, 188, 255, 0.2);
        }

        #start-btn:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 20px 48px rgba(208, 188, 255, 0.4);
            letter-spacing: 0.25em;
        }

        #loading {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #E2E8F0;
            z-index: 1500;
        }

        .hint-text {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
            pointer-events: none;
        }
    </style>
    </style>

    <!-- MediaPipe Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <video class="input_video" playsinline></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <button class="exit-btn" onclick="window.location.href='index.html'">✕</button>

    <div id="start-screen">
        <h1>Probador de Anillo Inmersivo</h1>
        <p style="margin-bottom: 30px; opacity: 0.8;">Muestra tu mano a la cámara para probarte el anillo de diamante de
            la Sala Arte.</p>
        <button id="start-btn">Iniciar Experiencia</button>
    </div>

    <div id="loading" style="display: none;">Cargando sistema de IA...</div>
    <div class="hint-text">Muestra tu mano frente a la cámara</div>

    <script type="module" src="ring-tryon.js"></script>
</body>

</html>
